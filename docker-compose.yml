# Local development only — do not deploy this compose file to production.

networks:
  centrix:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    networks:
      - centrix
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pos_erp
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: ghcr.io/sharks2001new/centrix-erp-backend-api:local
    restart: unless-stopped
    networks:
      - centrix
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST_LOCAL: mysql
      DB_DATABASE_LOCAL: pos_erp
      DB_USERNAME_LOCAL: root
      DB_PASSWORD_LOCAL: root
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_FREE_PROVIDER: ${AI_FREE_PROVIDER:-gemini}

  queue:
    build: .
    image: ghcr.io/sharks2001new/centrix-erp-backend-api:local
    restart: unless-stopped
    networks:
      - centrix
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST_LOCAL: mysql
      DB_DATABASE_LOCAL: pos_erp
      DB_USERNAME_LOCAL: root
      DB_PASSWORD_LOCAL: root
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      RUN_MIGRATIONS_ON_START: "false"
      RUN_PERMISSIONS_SYNC_ON_START: "false"
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
    command: ["php", "artisan", "queue:work", "--memory=512", "--timeout=3600", "--sleep=1", "--tries=1"]

volumes:
  mysql-data:
