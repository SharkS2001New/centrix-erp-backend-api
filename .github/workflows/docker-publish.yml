# Docker image build and publish only — no PHPUnit, no `php artisan test`.
# VERSION is updated in the release changes before they are pushed. This workflow
# reads it for image tags and never generates or commits a product version.
name: Docker Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/ci.yml"

# Serialize publishes on the same ref so concurrent pushes don't race the
# downstream Helm commit. Do NOT cancel in-progress runs here — a half-published
# image + half-updated Helm values is worse than a short queue.
concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: centrix-erp-backend-api

jobs:
  build:
    # Always run on PRs; respect explicit CI skips on branch pushes.
    if: >-
      github.event_name == 'pull_request' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read Centrix VERSION
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version in X.Y.Z format." >&2
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Centrix v${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=v${{ steps.version.outputs.value }}

      - name: Resolve image tag for Helm
        id: image_tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # NOTE: GITHUB_TOKEN build-arg removed — composer resolves all deps from
      # public packagist/github without auth on this project (verified locally).
      # Re-add it only if composer starts hitting GitHub API rate limits.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # ignore-error: GHA cache export can 504 after a successful push and
          # must not fail the job (image is already on ghcr.io).
          cache-to: type=gha,mode=max,ignore-error=true

      # Notify centrixerpk3setup that a new image is published. That repo's
      # deploy.yml listens for backend-image-published, bumps the tag in all
      # four backend-chart values.yaml files (api, worker, scheduler, reverb)
      # on main, and runs helm upgrade from the self-hosted runner on the
      # k3s host.
      #
      # CENTRIXERPK3SETUP_DISPATCH_TOKEN is a fine-grained PAT owned by
      # chegelawrence, scoped to chegelawrence/centrixerpk3setup only with
      # Contents: Read/write + Actions: Read/write. It is NOT interchangeable
      # with PERSONAL_ACCESS_TOKEN (which belongs to SharkS2001New and only
      # has write:packages for GHCR).
      - name: Dispatch deploy to centrixerpk3setup
        if: github.event_name != 'pull_request'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CENTRIXERPK3SETUP_DISPATCH_TOKEN }}
          repository: chegelawrence/centrixerpk3setup
          event-type: backend-image-published
          client-payload: |
            {
              "tag": "${{ steps.image_tag.outputs.value }}",
              "sha": "${{ github.sha }}",
              "version": "${{ steps.version.outputs.value }}",
              "source_repo": "${{ github.repository }}",
              "source_run_id": "${{ github.run_id }}"
            }
