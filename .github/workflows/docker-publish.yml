# Docker image build and publish only — no PHPUnit, no `php artisan test`.
# On every push to main/master, bumps Centrix VERSION (patch) before the image
# build so the shipped container matches the product version, then commits VERSION
# with [skip ci] so workflows do not loop.
name: Docker Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: centrix-erp-backend-api

jobs:
  build:
    # Always run on PRs; on push, skip VERSION-bump commits to avoid loops.
    if: >-
      github.event_name == 'pull_request' ||
      (
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[skip version]')
      )
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump Centrix VERSION (patch)
        id: bump
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail
          BEFORE="$(tr -d '[:space:]' < VERSION 2>/dev/null || echo '0.0.0')"
          if ! [[ "$BEFORE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            BEFORE="0.0.0"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BEFORE"
          PATCH=$((PATCH + 1))
          AFTER="${MAJOR}.${MINOR}.${PATCH}"
          printf '%s\n' "$AFTER" > VERSION
          echo "before=${BEFORE}" >> "$GITHUB_OUTPUT"
          echo "after=${AFTER}" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "Bumped Centrix ${BEFORE} → ${AFTER} (included in this image build)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=v${{ steps.bump.outputs.after }},enable=${{ steps.bump.outputs.bumped == 'true' }}

      - name: Resolve image tag for Helm
        id: image_tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push VERSION
        if: github.event_name == 'push' && steps.bump.outputs.bumped == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          if git diff --staged --quiet; then
            echo "VERSION unchanged."
            exit 0
          fi
          git commit -m "chore: bump Centrix version to ${{ steps.bump.outputs.after }} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "VERSION push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); retrying…"
            sleep $((attempt * 2))
          done
          echo "Failed to push VERSION after 5 attempts."
          exit 1

      - name: Check out pitchpredk3ssetup
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/pitchpredk3ssetup
          path: pitchpredk3ssetup
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Update Helm image tags
        if: github.event_name != 'pull_request'
        run: |
          TAG="${{ steps.image_tag.outputs.value }}"
          for file in \
            pitchpredk3ssetup/centrix-erp-backend-api/values.yaml \
            pitchpredk3ssetup/centrix-erp-scheduler/values.yaml \
            pitchpredk3ssetup/centrix-erp-queue-worker/values.yaml \
            pitchpredk3ssetup/centrix-erp-reverb/values.yaml
          do
            sed -i '/^[[:space:]]*tag:/d' "$file"
            sed -i "/pullPolicy:/a\\  tag: ${TAG}" "$file"
            echo "Updated ${file} -> ${TAG}"
          done

      - name: Commit and push pitchpredk3ssetup
        if: github.event_name != 'pull_request'
        # Uses PERSONAL_ACCESS_TOKEN — scope to repo contents only; protect pitchpredk3ssetup main branch.
        run: |
          cd pitchpredk3ssetup
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add centrix-erp-backend-api/values.yaml centrix-erp-scheduler/values.yaml centrix-erp-queue-worker/values.yaml centrix-erp-reverb/values.yaml
          if git diff --staged --quiet; then
            echo "No tag changes to commit."
            exit 0
          fi
          git commit -m "chore(centrix-erp-backend-api): bump image tag to ${{ steps.image_tag.outputs.value }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); retrying after rebase…"
            sleep $((attempt * 2))
          done
          echo "Failed to push pitchpredk3ssetup after 5 attempts."
          exit 1
