# Docker image build and publish only — no PHPUnit, no `php artisan test`.
# VERSION is updated in the release changes before they are pushed. This workflow
# reads it for image tags and never generates or commits a product version.
name: Docker Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: centrix-erp-backend-api

jobs:
  build:
    # Always run on PRs; respect explicit CI skips on branch pushes.
    if: >-
      github.event_name == 'pull_request' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read Centrix VERSION
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version in X.Y.Z format." >&2
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Centrix v${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=v${{ steps.version.outputs.value }}

      - name: Resolve image tag for Helm
        id: image_tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Check out pitchpredk3ssetup
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/pitchpredk3ssetup
          path: pitchpredk3ssetup
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Update Helm image tags
        if: github.event_name != 'pull_request'
        run: |
          TAG="${{ steps.image_tag.outputs.value }}"
          for file in \
            pitchpredk3ssetup/centrix-erp-backend-api/values.yaml \
            pitchpredk3ssetup/centrix-erp-scheduler/values.yaml \
            pitchpredk3ssetup/centrix-erp-queue-worker/values.yaml \
            pitchpredk3ssetup/centrix-erp-reverb/values.yaml
          do
            sed -i '/^[[:space:]]*tag:/d' "$file"
            sed -i "/pullPolicy:/a\\  tag: ${TAG}" "$file"
            echo "Updated ${file} -> ${TAG}"
          done

      - name: Create Helm image update pull request
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: pitchpredk3ssetup
          branch: automation/centrix-erp-backend-api-image
          delete-branch: true
          add-paths: |
            centrix-erp-backend-api/values.yaml
            centrix-erp-scheduler/values.yaml
            centrix-erp-queue-worker/values.yaml
            centrix-erp-reverb/values.yaml
          commit-message: "chore(centrix-erp-backend-api): bump image tag to ${{ steps.image_tag.outputs.value }}"
          title: "chore(centrix-erp-backend-api): bump image tag to ${{ steps.image_tag.outputs.value }}"
          body: "Updates the Centrix ERP API, scheduler, queue-worker, and Reverb Helm charts to the newly published image."
          base: master
