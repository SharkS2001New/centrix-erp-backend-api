# Docker image build and publish only — no PHPUnit, no `php artisan test`.
# VERSION is updated in the release changes before they are pushed. This workflow
# reads it for image tags and never generates or commits a product version.
name: Docker Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/ci.yml"

# Serialize publishes on the same ref so concurrent pushes don't race the
# downstream Helm commit. Do NOT cancel in-progress runs here — a half-published
# image + half-updated Helm values is worse than a short queue.
concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: centrix-erp-backend-api

jobs:
  build:
    # Always run on PRs; respect explicit CI skips on branch pushes.
    if: >-
      github.event_name == 'pull_request' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read Centrix VERSION
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version in X.Y.Z format." >&2
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Centrix v${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=v${{ steps.version.outputs.value }}

      - name: Resolve image tag for Helm
        id: image_tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # NOTE: GITHUB_TOKEN build-arg removed — composer resolves all deps from
      # public packagist/github without auth on this project (verified locally).
      # Re-add it only if composer starts hitting GitHub API rate limits.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # ignore-error: GHA cache export can 504 after a successful push and
          # must not fail the job (image is already on ghcr.io).
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Check out centrixerpk3setup
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/centrixerpk3setup
          path: centrixerpk3setup
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Update Helm image tags
        if: github.event_name != 'pull_request'
        run: |
          TAG="${{ steps.image_tag.outputs.value }}"
          for file in \
            centrixerpk3setup/centrix-erp-backend-api/values.yaml \
            centrixerpk3setup/centrix-erp-scheduler/values.yaml \
            centrixerpk3setup/centrix-erp-queue-worker/values.yaml \
            centrixerpk3setup/centrix-erp-reverb/values.yaml
          do
            sed -i '/^[[:space:]]*tag:/d' "$file"
            sed -i "/pullPolicy:/a\\  tag: ${TAG}" "$file"
            echo "Updated ${file} -> ${TAG}"
          done

      - name: Commit and push centrixerpk3setup
        if: github.event_name != 'pull_request'
        # Uses PERSONAL_ACCESS_TOKEN — scope to repo contents only; protect centrixerpk3setup default branch.
        run: |
          cd centrixerpk3setup
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add centrix-erp-backend-api/values.yaml centrix-erp-scheduler/values.yaml centrix-erp-queue-worker/values.yaml centrix-erp-reverb/values.yaml
          if git diff --staged --quiet; then
            echo "No tag changes to commit."
            exit 0
          fi
          git commit -m "chore(centrix-erp-backend-api): bump image tag to ${{ steps.image_tag.outputs.value }}"
          DEFAULT_BRANCH="$(git symbolic-ref --short HEAD)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$DEFAULT_BRANCH"
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); retrying after rebase…"
            sleep $((attempt * 2))
          done
          echo "Failed to push centrixerpk3setup after 5 attempts."
          exit 1
