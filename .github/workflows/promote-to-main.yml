# DEPRECATED: promote now runs inside CI (ci.yml → promote job) on every
# successful push to master. Kept disabled so we do not race two promote jobs.
#
# If you need a manual re-promote, re-run the CI workflow for the master tip
# (or temporarily restore the workflow_run trigger below).
name: Promote to main

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Rebase master onto main (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Promote master → main and sync master
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin master main

          MAIN_SHA="$(git rev-parse origin/main)"
          MASTER_SHA="$(git rev-parse origin/master)"

          echo "==> Comparing branches before promote"
          echo "main:   ${MAIN_SHA}"
          echo "master: ${MASTER_SHA}"

          if [[ "${MASTER_SHA}" == "${MAIN_SHA}" ]]; then
            echo "master and main already aligned."
            exit 0
          fi

          # main ahead only — fast-forward master so it is never behind.
          if git merge-base --is-ancestor "${MASTER_SHA}" "${MAIN_SHA}"; then
            git push origin "${MAIN_SHA}:refs/heads/master"
            echo "Synced master → ${MAIN_SHA} (ff-only)"
            exit 0
          fi

          git checkout -B promote-temp "${MASTER_SHA}"

          if ! git rebase "${MAIN_SHA}"; then
            git rebase --abort || true
            echo "::error::Rebase conflict promoting master onto main."
            exit 1
          fi

          PROMOTE_SHA="$(git rev-parse HEAD)"

          if ! git merge-base --is-ancestor "${MAIN_SHA}" "${PROMOTE_SHA}"; then
            echo "::error::Aborting: rebase result lost commits from main."
            exit 1
          fi

          git checkout -B main "${MAIN_SHA}"
          git merge --ff-only "${PROMOTE_SHA}"
          git push origin main
          git push --force-with-lease=refs/heads/master:"${MASTER_SHA}" \
            origin "${PROMOTE_SHA}:refs/heads/master"
          echo "Promoted and aligned master + main at ${PROMOTE_SHA}"
